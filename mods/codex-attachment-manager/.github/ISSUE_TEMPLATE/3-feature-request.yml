name: 需求建議 / Feature request
description: 想要的功能，或者現在不好用的地方 / Something you would like it to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的問題 / The problem
      description: 在什麼場景下，現在哪裡不方便 / When does it get in your way
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎麼解決 / What you would like
  - type: dropdown
    id: platform
    attributes:
      label: 平臺 / Platform
      multiple: true
      options: [Windows, macOS, Linux]
